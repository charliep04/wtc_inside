<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photos taken within the WTC Complex</title>

<style>

@font-face {
  font-family: 'AGaramondPro';
  src: url('fonts/AGaramondPro-Regular.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
}


* {
  box-sizing: border-box;
}


body {
  margin: 0;
  background: #0c0c0c;
  color: #ffffff;
  font-family: 'AGaramondPro', 'Times New Roman', serif;
  line-height: 1.45;
}


.page-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 40px 24px 80px 24px;
}


/* Main title */

.title {
  text-align: center;
  font-size: 20px;
  margin: 0 0 20px 0;
}


/* Filter navigation */

.filters {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  margin: 0 0 38px 0;
  font-size: 15px;
}


.filter-button {
  appearance: none;
  border: none;
  padding: 0;
  margin: 0;
  background: none;
  color: #888888;
  font-family: inherit;
  font-size: inherit;
  line-height: 1.4;
  cursor: pointer;
  transition: color 0.2s ease;
}


.filter-button:hover {
  color: #ffffff;
}


.filter-button.active {
  color: #ffffff;
}


/* Gallery */

.gallery {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}


.photo {
  text-align: left;
}


.photo.hidden {
  display: none;
}


.photo img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border: none;
  padding: 0;
  background: none;
  cursor: pointer;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}


.photo img:hover {
  opacity: 0.85;
  transform: scale(1.015);
}


/* Metadata hidden from gallery */

.photo-info {
  display: none;
}


/* ================================= */
/* LIGHTBOX */
/* ================================= */

.lightbox {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 40px;

  background: rgba(0, 0, 0, 0.78);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  z-index: 9999;

  opacity: 0;

  transition: opacity 0.25s ease;
}


.lightbox.active {
  display: flex;
  opacity: 1;
}


.lightbox-content {
  position: relative;

  width: min(900px, 100%);
  max-height: 90vh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  animation: lightboxIn 0.25s ease;
}


@keyframes lightboxIn {

  from {
    transform: scale(0.96);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }

}


/*
  IMPORTANT:

  The lightbox image now has a fixed display area.
  This means small thumbnail files such as
  DSCN3626-thumb.jpg, DSCN3634-thumb.JPG, etc.
  will scale UP just like larger source images.

  object-fit: contain keeps the complete image visible
  without cropping it.
*/

.lightbox-image {
  display: block;

  width: min(900px, 100%);
  height: 70vh;

  border: none;
  padding: 0;

  background: none;

  object-fit: contain;
}


/* Lightbox information */

.lightbox-info {
  max-width: 750px;

  margin-top: 18px;

  color: #d6d6d6;

  text-align: center;

  font-size: 13px;

  line-height: 1.45;
}


.lightbox-info ul {
  list-style: none;

  margin: 0;
  padding: 0;
}


.lightbox-info li {
  margin: 2px 0;
}


.lightbox-info .label {
  color: #ffffff;
}


/* Close button */

.lightbox-close {
  position: absolute;

  top: -15px;
  right: -15px;

  width: 36px;
  height: 36px;

  border: 1px solid #ffffff;
  border-radius: 50%;

  background: #0c0c0c;

  color: #ffffff;

  font-family: Arial, sans-serif;

  font-size: 24px;
  font-weight: 300;

  line-height: 32px;

  text-align: center;

  cursor: pointer;

  z-index: 2;

  transition:
    background 0.2s ease,
    color 0.2s ease;
}


.lightbox-close:hover {
  background: #ffffff;
  color: #0c0c0c;
}


/* Footer */

.footer {
  margin-top: 45px;

  font-size: 12px;

  color: #ffffff;

  text-align: center;
}


/* ================================= */
/* TABLET */
/* ================================= */

@media (max-width: 800px) {

  .gallery {
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }


  .lightbox {
    padding: 25px;
  }


  .lightbox-image {
    width: 100%;
    height: 65vh;
  }

}


/* ================================= */
/* MOBILE / IPHONE */
/* ================================= */

@media (max-width: 500px) {

  .page-container {
    padding: 30px 16px 60px 16px;
  }


  .title {
    margin-bottom: 18px;
  }


  .filters {
    gap: 10px;
    margin-bottom: 30px;
    font-size: 14px;
  }


  /*
    Two square thumbnails across on iPhone.
  */

  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }


  .lightbox {
    padding: 20px;
  }


  /*
    Small images still scale up inside the
    same lightbox display area.
  */

  .lightbox-image {
    width: 100%;
    height: 60vh;
    object-fit: contain;
  }


  .lightbox-info {
    font-size: 12px;
    margin-top: 14px;
  }


  .lightbox-close {
    top: -12px;
    right: -8px;
  }

}

</style>
</head>

<!-- LIGHTBOX -->
<!-- ================================= -->


<div class="lightbox" id="lightbox">

  <div class="lightbox-content">

    <button
      class="lightbox-close"
      id="lightboxClose"
      aria-label="Close"
      type="button"
    >
      ×
    </button>


    <img
      class="lightbox-image"
      id="lightboxImage"
      src=""
      alt=""
    >


    <div class="lightbox-info" id="lightboxInfo">

      <ul>

        <li>
          <span class="label">Building:</span>
          <span id="infoBuilding"></span>
        </li>

        <li>
          <span class="label">Location:</span>
          <span id="infoLocation"></span>
        </li>

        <li>
          <span class="label">Time:</span>
          <span id="infoTime"></span>
        </li>

        <li>
          <span class="label">Photographer:</span>
          <span id="infoPhotographer"></span>
        </li>

      </ul>

    </div>

  </div>

</div>


<script>


/* ================================= */
/* FILTER SYSTEM */
/* ================================= */


const filterButtons =
  document.querySelectorAll('.filter-button');


const photos =
  document.querySelectorAll('.photo');


filterButtons.forEach(function(button) {

  button.addEventListener('click', function() {

    const filter =
      button.dataset.filter;


    /* Update active button */

    filterButtons.forEach(function(item) {

      item.classList.remove('active');

    });


    button.classList.add('active');


    /* Show / hide photos */

    photos.forEach(function(photo) {

      const building =
        photo.dataset.building;


      if (filter === 'all' || building === filter) {

        photo.classList.remove('hidden');

      } else {

        photo.classList.add('hidden');

      }

    });

  });

});


/* ================================= */
/* LIGHTBOX */
/* ================================= */


const lightbox =
  document.getElementById('lightbox');


const lightboxImage =
  document.getElementById('lightboxImage');


const lightboxClose =
  document.getElementById('lightboxClose');


const infoBuilding =
  document.getElementById('infoBuilding');


const infoLocation =
  document.getElementById('infoLocation');


const infoTime =
  document.getElementById('infoTime');


const infoPhotographer =
  document.getElementById('infoPhotographer');


const galleryImages =
  document.querySelectorAll('.photo img');


galleryImages.forEach(function(image) {


  image.addEventListener('click', function() {


    /*
      Use the clicked image itself as the lightbox source.

      Because .lightbox-image has a fixed display area
      and object-fit: contain, even a small thumbnail
      will be enlarged to fit the available space.
    */

    lightboxImage.src =
      image.src;


    lightboxImage.alt =
      image.alt;


    infoBuilding.textContent =
      image.dataset.building || '';


    infoLocation.textContent =
      image.dataset.location || '';


    infoTime.textContent =
      image.dataset.time || '';


    infoPhotographer.textContent =
      image.dataset.photographer || '';


    lightbox.classList.add('active');


    document.body.style.overflow =
      'hidden';


  });


});


/* ================================= */
/* CLOSE LIGHTBOX */
/* ================================= */


function closeLightbox() {

  lightbox.classList.remove('active');

  document.body.style.overflow = '';

}


/* Close button */

lightboxClose.addEventListener(
  'click',
  function(event) {

    event.stopPropagation();

    closeLightbox();

  }
);


/* Click outside image */

lightbox.addEventListener(
  'click',
  function(event) {

    if (event.target === lightbox) {

      closeLightbox();

    }

  }
);


/* Escape key */

document.addEventListener(
  'keydown',
  function(event) {

    if (event.key === 'Escape') {

      closeLightbox();

    }

  }
);


</script>
